name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/make_demo_video.py
      - run: cd backend && python -m pytest tests -q

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - run: npm install --no-save jsdom
      - name: Run the dashboard UI test against a live server (mock Groq, demo mode)
        run: |
          python scripts/mock_groq.py &
          export SEED_PASSWORD=ci-Password-12345 JWT_SECRET=ci-secret-0123456789abcdef0123456789abcdef
          export GROQ_API_KEY=mock GROQ_BASE_URL=http://127.0.0.1:9000/openai/v1 DEMO_MODE=1
          export DATABASE_URL=sqlite:///$RUNNER_TEMP/ci.db STORAGE_DIR=$RUNNER_TEMP/storage
          python -m uvicorn app.main:app --app-dir backend --port 8000 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/api/v1/system/health >/dev/null && break; sleep 1; done
          sleep 12   # let the background sample-data seeding finish
          BASE=http://127.0.0.1:8000 node scripts/ui_test.mjs
